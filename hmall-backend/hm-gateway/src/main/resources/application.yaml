server:
  port: 8080
spring:
  application:
    name: hm-gateway
  cloud:
    nacos:
      discovery:
        server-addr: 10.211.55.9:8848
    gateway:
      routes:
        - id: hm-item-service  # 路由规则id，自定义，唯一
          uri: lb://hm-item-service  # 路由的目标服务，lb代表负载均衡，会从注册中心拉取服务列表
          predicates:  # 路由断言，判断当前请求是否符合当前规则，符合则路由到目标服务
            - Path=/items/**,/search/**  # 这里是以请求路径作为判断规则
        - id: hm-cart-service
          uri: lb://hm-cart-service
          predicates:
            - Path=/carts/**
        - id: hm-user-service
          uri: lb://hm-user-service
          predicates:
            - Path=/users/**,/addresses/**
        - id: hm-trade-service
          uri: lb://hm-trade-service
          predicates:
            - Path=/orders/**
        - id: hm-pay-service
          uri: lb://hm-pay-service
          predicates:
            - Path=/pay-orders/**

hm:
  jwt:
    location: classpath:hmall.jks
    alias: hmall
    password: hmall123
    tokenTTL: 30m
  auth:
    excludePaths:
      - /search/**
      - /users/login
      - /items/**
      - /hi